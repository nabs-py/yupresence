services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: yupresence
      POSTGRES_USER: yupresence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yupresence -d yupresence"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://yupresence:${POSTGRES_PASSWORD}@postgres:5432/yupresence?schema=public
      JWT_SECRET: ${JWT_SECRET}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - api_uploads:/app/apps/api/uploads

volumes:
  postgres_data:
  api_uploads:
